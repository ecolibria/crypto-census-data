name: Validate datasets

# Two properties, both of which a citation depends on:
#
#   1. Every published dataset still matches the hashes recorded for it, and is
#      internally consistent with its own aggregate.
#   2. No already-published dataset is being rewritten by this change.
#
# The second cannot run on `push` alone -- it needs a base to compare against --
# so it is scoped to pull requests, while validation runs on both.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Hashes, schema and arithmetic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The runner's cores, memory and Node version, in the log beside the
      # times the steps below take.
      - name: Record the runner
        run: nproc; free -m; node --version

      - name: Validate every dataset
        run: node scripts/validate-dataset.mjs

      # Each test step opens with the four lines the validator's output opens
      # with, written on both streams by scripts/stop-commands.mjs before
      # node --test in the same run: the job's three problem matchers removed,
      # then the stop line with a fresh token. From there on the runner reads
      # a test's name, and what a failing test prints, as text, whatever they
      # hold. The step's result is node --test's own.

      # The validator's own rules, run against copies in a temporary directory.
      - name: Check the validator
        run: node scripts/stop-commands.mjs && node --test scripts/check-validator.mjs

      # The rules an errata file lives under, in the validator and in the
      # immutability check, run against copies and scratch repositories.
      - name: Check the errata rules
        run: node scripts/stop-commands.mjs && node --test scripts/check-errata.mjs

      # The version 2 rules, run against a small version 2 dataset built in a
      # temporary directory, with one defect planted per test.
      - name: Check the version 2 rules
        run: node scripts/stop-commands.mjs && node --test scripts/check-validator-v2.mjs

  immutable:
    name: No published dataset is rewritten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # check-immutable.mjs diffs against the merge base, so the history
          # between base and head has to be present. A shallow clone reports
          # every file as added and the check passes without checking anything.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Always against the default branch, whatever branch the pull request
      # targets. Compared with its own target, a change aimed at a branch that
      # already holds a rewrite would have nothing left to show.
      - name: Check immutability against the default branch
        run: node scripts/check-immutable.mjs "refs/remotes/origin/${{ github.event.repository.default_branch }}"
